<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሆቴል ማኔጅመንት ሲስተም - Main Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .btn {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-customer { background-color: #28a745; }
        .btn-customer:hover { background-color: #218838; }
        .btn-controller { background-color: #ffc107; color: #333; }
        .btn-controller:hover { background-color: #e0a800; }
        .btn-hotel { background-color: #17a2b8; }
        .btn-hotel:hover { background-color: #138496; }
    </style>
</head>
<body>

    <div class="container">
        <h1> / Select Interface</h1>
        
        <a href="https://amanuelyenealm613-cell.github.io/Costemer-interface/" class="btn btn-customer" target="_blank">
            🛒 Customer Interface
        </a>

        <a href="https://amanuelyenealm613-cell.github.io/Controlerpage/" class="btn btn-controller" target="_blank">
            ⚙️ Controller Page
        </a>

        <a href="https://amanuelyenealm613-cell.github.io/Hotelcontrolpage/" class="btn btn-hotel" target="_blank">
            🏨 Hotel Control Page
        </a>
    </div>

</body>
</html>
